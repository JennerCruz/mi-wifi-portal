<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Wi-Fi</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 32px 24px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 360px; width: 100%; text-align: center; }
        h2 { margin-top: 0; color: #1c1c1e; font-size: 22px; }
        p { color: #8e8e93; font-size: 14px; margin-bottom: 24px; }
        input { width: 100%; padding: 14px; font-size: 18px; text-align: center; letter-spacing: 2px; border: 1px solid #c7c7cc; border-radius: 12px; margin-bottom: 16px; outline: none; background: #fafafa; }
        input:focus { border-color: #007aff; background: #fff; }
        button { width: 100%; background: #007aff; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:active { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Conectar a Wi-Fi</h2>
        <p>Ingresa tu PIN de acceso para configurar la red en tu dispositivo:</p>
        <form action="/api/descargar" method="POST">
            <input type="text" name="pin" placeholder="Ej. 27e84949" required autocomplete="off">
            <button type="submit">Instalar Perfil de Red</button>
        </form>
    </div>
</body>
</html>
